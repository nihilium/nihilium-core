version: '3.8'

services:
  processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.processor
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      # Evidence quorum (W-of-N acks required before HTTP 200 on seal/unseal)
      - EVIDENCE_QUORUM=3/3
      - EVIDENCE_BACKENDS=[{"type":"local","path":"/data/e0","id":"e0"},{"type":"local","path":"/data/e1","id":"e1"},{"type":"local","path":"/data/e2","id":"e2"}]
      # Optional: EVIDENCE_ENCRYPTION_KEY=64_hex_chars_32_bytes
      # Optional: EVIDENCE_HEALTH_STRICT=true
      # Add your required environment variables here:
      # - PRIVATE_KEY=your_private_key
      # - PRIVATE_KEY_HE=your_he_private_key
      # - CHAINED_PROOF_CONTRACT_ADDRESS=contract_address
      # - RPC_URL=your_rpc_url
      # - CHAIN_ID=1337
      # - OPENING_PROOF_ADDRESS=opening_proof_address
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - processor_evidence:/data
    networks:
      - processor_network

networks:
  processor_network:
    driver: bridge

volumes:
  processor_evidence:
