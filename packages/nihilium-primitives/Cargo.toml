[package]
name = "nihilium-primitives"
edition = "2021"
version = "0.1.0"
description = "Rust implementation of the nihilium protocol primitives (e.g. cryptography, blockchain primitives, etc.)"

[dependencies]
# hashing
sha2 = "0.10.9"
sha3 = "0.10.8"
blake2 = "0.10.6"
light-poseidon = "0.4.0"
mimc-rs = "0.0.2"

# arkworks
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
ark-groth16 = "0.5.0"
ark-circom = "0.5.0"

# HE
jubjub-elgamal = "0.4.3"
dusk-jubjub = "0.15"

# Merkle
rs_merkle = "1.5.0"

# blockchain primitives
alloy-sol-macro = { version = "1.4.0", features = ["json"] }
alloy-sol-types = "1.4.0"
alloy-contract = "1.0.38"
alloy-provider = "1.0.38"
alloy-signer = "1.0.38"
alloy-network = "1.0.38"
alloy-rpc-types = "1.0.38"

# serde
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# async
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"
reqwest = { version = "0.12.24", features = ["json"] }

# key value store
redb = { version = "2.1", optional = true }
rocksdb = { version = "0.24.0", optional = true }

# error
thiserror = "2.0.17"
anyhow = "1.0.100"

# misc
num-bigint = "0.2.6"  # Match mimc-rs dependency version
num-traits = "0.2.19"
hex = "0.4.3"
base64 = "0.22.1"
bytes = "1.10.1"
rand = "0.9.2"
rand_core = "0.9.3"
getrandom = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"
tokio-test = "0.4"

[features]
default = ["redb"]  # Use redb by default (much faster to compile)
persistence-rocksdb = ["rocksdb"]  # Heavy but production-grade
persistence-redb = ["redb"]  # Pure Rust, actively maintained
