[package]
name = "dlog-solver-rs"
version = "0.1.0"
edition = "2021"
authors = ["Nihilium Team"]
description = "Discrete logarithm solver for Baby Jubjub using lookup tables"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16", features = ["napi8", "serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-std = "0.4"
num-bigint = "0.4"
hex = "0.4"
thiserror = "1.0"
ahash = "0.8"
lazy_static = "1.4"
blake2 = "0.10"

[build-dependencies]
napi-build = "2.3"

